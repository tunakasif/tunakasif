name: Update contributor stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate contributor stats
        uses: HwangTaehyun/github-contributor-stats/action@main
        with:
          username: tunakasif
          output-file: github-contributor-stats.svg
          limit: "5"
          theme: dark
          combine-all-yearly-contributions: "true"

      - name: Commit updated stats
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update contributor stats"
          file_pattern: github-contributor-stats.svg
